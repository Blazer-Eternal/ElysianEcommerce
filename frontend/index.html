<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElysianEcommerce</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      /* Preload the LCP hero image, but ONLY on the home page: on any deep
         link this ~1.5MB PNG would be downloaded and never rendered. */
      if (location.pathname === "/") {
        var heroLink = document.createElement("link");
        heroLink.rel = "preload";
        heroLink.as = "image";
        heroLink.href = "/HeroSection.png";
        heroLink.fetchPriority = "high";
        document.head.appendChild(heroLink);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
